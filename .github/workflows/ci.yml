name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/kb.py build
      - name: Check that the committed knowledge/index.md is up to date
        run: git diff --exit-code -- knowledge/index.md
      - run: python scripts/kb.py search 'refresh token'
      - run: python scripts/kb.py get authentication#refresh-tokens
